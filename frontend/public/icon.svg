<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scoopr">
  <title>Scoopr</title>
  <!--
    Scoopr app mark.
    One silhouette does triple duty: a circle on an angled handle reads as both a
    magnifying glass (investigative / "the scoop") and an ice-cream scoop; the
    stacked bars inside the lens read as newspaper headline lines.
    Colours are taken straight from frontend/src/styles/tokens.css:
      color-bg   (#000000)
      color-text (#ffffff)
  -->
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256 256) scale(1.15) translate(-248 -240)">
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <!-- handle (drawn first so the lens ring sits on top of it) -->
      <path d="M301 293 L400 392" stroke-width="36"/>
      <!-- lens / scoop -->
      <circle cx="216" cy="208" r="120" stroke-width="26"/>
      <!-- headline lines -->
      <path d="M148 168 H288" stroke-width="24"/>
      <path d="M148 212 H288" stroke-width="24"/>
      <path d="M148 256 H236" stroke-width="24"/>
    </g>
  </g>
</svg>
