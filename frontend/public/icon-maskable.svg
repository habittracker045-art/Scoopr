<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scoopr">
  <title>Scoopr</title>
  <!--
    Maskable variant of the Scoopr mark.
    Identical artwork to icon.svg, scaled to 0.85 of the base mark so the whole
    bounding box sits inside the 80% safe zone (a centred circle of radius 204.8px
    in a 512px canvas) that Android may crop to a circle, squircle, rounded square
    or teardrop. Background is full-bleed so no transparent corners are ever shown.
  -->
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256 256) scale(0.85) translate(-248 -240)">
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M301 293 L400 392" stroke-width="36"/>
      <circle cx="216" cy="208" r="120" stroke-width="26"/>
      <path d="M148 168 H288" stroke-width="24"/>
      <path d="M148 212 H288" stroke-width="24"/>
      <path d="M148 256 H236" stroke-width="24"/>
    </g>
  </g>
</svg>
